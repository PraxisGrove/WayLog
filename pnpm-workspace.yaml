packages:
  - .
  - admin-web
  - os-web

allowBuilds:
  "@google/genai": false
  "@sentry/cli": true
  protobufjs: false
  sharp: true
  unrs-resolver: true

nodeLinker: hoisted

supportedArchitectures:
  os:
    - current
  cpu:
    - current
  libc:
    - current

patchedDependencies:
  "@earendil-works/pi-agent-core@0.84.3": patches/@earendil-works__pi-agent-core@0.84.3.patch
  "@earendil-works/pi-ai@0.84.3": patches/@earendil-works__pi-ai@0.84.3.patch
  react-native-wechat-lib: patches/react-native-wechat-lib.patch

minimumReleaseAgeExclude:
